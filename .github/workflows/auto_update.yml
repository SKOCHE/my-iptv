name: IPTV Aggregator — collect, check and publish
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - "channels.json"
      - "update_playlist.py"
      - "validate_config.py"
      - ".github/workflows/auto_update.yml"
permissions:
  contents: write
concurrency:
  group: iptv-aggregator-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate config
        run: python3 validate_config.py
      - name: Build aggregator
        run: python3 update_playlist.py
      - name: Upload reports and candidate playlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-aggregator-results
          path: |
            update_report.txt
            test_candidates.m3u
            favorites.m3u
          if-no-files-found: warn
          retention-days: 30
      - name: Publish generated files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iptv-output"
          for f in favorites.m3u test_candidates.m3u update_report.txt; do
            if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/iptv-output/$f"; fi
          done
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/iptv-output/"* .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favorites.m3u test_candidates.m3u update_report.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Run IPTV aggregator and refresh diagnostics"
          git push origin HEAD:main
