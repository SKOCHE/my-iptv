name: Auto Update IPTV Playlist

on:
  schedule:
    # Запуск каждую ночь в 00:00 по Гринвичу
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать обновление вручную кнопкой в панели

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run script
      run: python update_playlist.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add favorites.m3u
        git commit -m "Автоматическое обновление плейлиста" || exit 0
        git push
