name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run playlist updater
        run: python update_playlist.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favorites.m3u
          if git diff --cached --quiet; then
            echo "Плейлист не изменился — коммит не нужен."
          else
            git commit -m "Автоматическое обновление IPTV-плейлиста"
            git push
          fi



