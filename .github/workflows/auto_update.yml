
name: Build verified IPTV playlist

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Build playlist
        run: python update_playlist.py

      - name: Show report
        if: always()
        run: |
          if [ -f update_report.txt ]; then
            cat update_report.txt
          else
            echo "ОТЧЁТ НЕ СОЗДАН"
          fi

      - name: Commit playlist and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favorites.m3u update_report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified IPTV playlist"
            git push
          fi




