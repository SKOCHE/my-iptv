name: Build strict Android TV IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'channels.json'
      - 'update_playlist.py'
      - 'validate_config.py'
      - '.github/workflows/auto_update.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Validate 41-channel manifest
        run: python validate_config.py
      - name: Build playlist
        env:
          MINIMUM_TO_PUBLISH: '5'
        run: python update_playlist.py
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-diagnostics
          path: |
            update_report.txt
            epg_mapping.txt
          if-no-files-found: warn
      - name: Commit playlist and reports
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favorites.m3u update_report.txt epg_mapping.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update IPTV playlist and diagnostics'
            # Rebase on the latest main to avoid non-fast-forward push failures.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo 'No changes to commit'
          fi
