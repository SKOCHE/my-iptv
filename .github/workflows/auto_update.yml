name: Build strict Android TV IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - "channels.json"
      - "update_playlist.py"
      - "validate_config.py"
      - ".github/workflows/auto_update.yml"

permissions:
  contents: write

concurrency:
  group: iptv-playlist-main
  cancel-in-progress: false

jobs:
  build:
    # Pin the OS instead of following ubuntu-latest migration.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check and install only missing tools
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is already installed: $(ffmpeg -version | head -n 1)"
          else
            echo "FFmpeg is missing; installing minimal package set..."
            sudo apt-get install -y --no-install-recommends ffmpeg || {
              echo "Apt package lists unavailable; updating once and retrying..."
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends ffmpeg
            }
          fi
          if python -c "from PIL import Image" >/dev/null 2>&1; then
            echo "Pillow is already installed"
          else
            python -m pip install --disable-pip-version-check Pillow
          fi

      - name: Validate configuration
        run: python validate_config.py

      - name: Build playlist
        run: python update_playlist.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-diagnostics
          path: |
            update_report.txt
            epg_mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish generated playlist without rebase conflicts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iptv-generated"
          cp favorites.m3u "$RUNNER_TEMP/iptv-generated/favorites.m3u"
          cp update_report.txt "$RUNNER_TEMP/iptv-generated/update_report.txt"
          cp epg_mapping.txt "$RUNNER_TEMP/iptv-generated/epg_mapping.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/iptv-generated/favorites.m3u" favorites.m3u
          cp "$RUNNER_TEMP/iptv-generated/update_report.txt" update_report.txt
          cp "$RUNNER_TEMP/iptv-generated/epg_mapping.txt" epg_mapping.txt
          git add favorites.m3u update_report.txt epg_mapping.txt
          if git diff --cached --quiet; then
            echo "No playlist or diagnostic changes to publish."
            exit 0
          fi
          git commit -m "Update IPTV playlist and diagnostics"
          git push origin HEAD:main





